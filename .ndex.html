<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck Runtime Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.15);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #005ea6;
        }

        .result {
            text-align: center;
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Truck Runtime Calculator</h1>

        <label>Truck Number</label>
        <input type="text" id="truckNumber" placeholder="Truck 101">

        <label>Start Time</label>
        <input type="time" id="startTime">

        <label>End Time</label>
        <input type="time" id="endTime">

        <button onclick="calculateTime()">Calculate Runtime</button>

        <div class="result" id="result">
            Total Time: 0h 0m
        </div>
    </div>

    <script>
        function calculateTime() {

            const start = document.getElementById("startTime").value;
            const end = document.getElementById("endTime").value;

            if (!start || !end) {
                alert("Enter both start and end times.");
                return;
            }

            const startDate = new Date("1970-01-01T" + start);
            const endDate = new Date("1970-01-01T" + end);

            let difference = endDate - startDate;

            if (difference < 0) {
                difference += 24 * 60 * 60 * 1000;
            }

            const hours = Math.floor(difference / (1000 * 60 * 60));
            const minutes = Math.floor(
                (difference % (1000 * 60 * 60)) / (1000 * 60)
            );

            document.getElementById("result").innerHTML =
                `Total Time: ${hours}h ${minutes}m`;
        }
    </script>

</body>
</html>
