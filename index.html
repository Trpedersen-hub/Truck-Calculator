<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truck Runtime Pro</title>
<meta name="theme-color" content="#020617">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#020617;color:white;padding:15px;}
.container{max-width:700px;margin:auto;}
h1{text-align:center;color:#4ade80;margin-bottom:10px;}
.card{background:#020617;border:1px solid #1f2937;border-radius:14px;padding:12px;margin-bottom:12px;}
label{font-size:14px;opacity:.7;}

.timeRow{display:flex;gap:8px;align-items:center;}

input{
flex:1;
padding:10px;
border-radius:8px;
border:1px solid #1f2937;
background:#020617;
color:#4ade80;
font-size:18px;
text-align:center;
}

.clockBtn{
width:50px;
background:#1f2937;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
}

.row{display:flex;gap:8px;margin-top:8px;}

button{
flex:1;
padding:10px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.primary{background:#22c55e;color:black;}
.secondary{background:#1f2937;color:white;}
.danger{background:#ef4444;color:white;}
.disabled{opacity:.4;cursor:not-allowed;}

.mode{
text-align:center;
padding:8px;
margin-bottom:10px;
background:#1f2937;
border-radius:10px;
cursor:pointer;
}

.result{text-align:center;margin-top:15px;}
.big{font-size:42px;color:#4ade80;}
.small{opacity:.75;}

.bar{height:8px;background:#1f2937;border-radius:10px;overflow:hidden;margin-top:10px;}
.fill{height:100%;background:#22c55e;width:0%;}
</style>
</head>

<body>
<div class="container">

<h1>🚛 Truck Runtime</h1>

<div id="modeBtn" class="mode" onclick="toggleMode()">15 MIN MODE</div>

<div id="entries"></div>

<button class="primary" onclick="addEntry()">+ Add Block</button>

<div class="card result">
<div class="big" id="total">0h 0m</div>
<div class="small" id="decimal">0.00 Hours</div>
<div class="small" id="quarter">Quarter: 0.00</div>
<div class="small" id="status">Ready</div>

<div class="bar"><div id="fill" class="fill"></div></div>
</div>

</div>

<script>
let stepMode = 15;
let entries = [];

function toggleMode(){
stepMode = stepMode === 15 ? 1 : 15;
document.getElementById("modeBtn").innerText =
stepMode === 15 ? "15 MIN MODE" : "1 MIN MODE";
render();
}

function addEntry(){
entries.push({id:Date.now(),start:"",end:""});
render();
}

function removeEntry(id){
if(entries.length === 1) return;
entries = entries.filter(e=>e.id!==id);
render();
}

function clearEntry(id){
let e = entries.find(x=>x.id===id);
e.start=""; e.end="";
render();
}

function update(id, field, val){
let e = entries.find(x=>x.id===id);
e[field]=val;

if(stepMode === 15 && val){
e[field] = snapTo15(val);
}

save();
calculate();
}

// ✅ snap any time to nearest 15
function snapTo15(time){
let d = new Date("2025-01-01T"+time);
let mins = Math.round(d.getMinutes()/15)*15;
d.setMinutes(mins);

return (
String(d.getHours()).padStart(2,'0') + ":" +
String(d.getMinutes()).padStart(2,'0')
);
}

// ✅ NEW: REAL-TIME SNAP
function snapEnd(id){
if(stepMode !== 15) return;

let now = new Date();

let mins = Math.round(now.getMinutes()/15)*15;
now.setMinutes(mins);

let h = String(now.getHours()).padStart(2,'0');
let m = String(now.getMinutes()).padStart(2,'0');

let e = entries.find(x=>x.id===id);
e.end = h + ":" + m;

render();
}

// ✅ open picker
function openPicker(el){
if(el.showPicker){ el.showPicker(); }
else{ el.focus(); }
}

function calculate(){

let totalMs = 0;

entries.forEach(e=>{
if(!e.start || !e.end) return;

let s = new Date("2025-01-01T"+e.start);
let eD = new Date("2025-01-01T"+e.end);

let diff = eD - s;
if(diff < 0) diff += 86400000;

if(stepMode === 15){
let mins = diff/60000;
mins = Math.round(mins/15)*15;
diff = mins*60000;
}

totalMs += diff;
});

let h = Math.floor(totalMs / 3600000);
let m = Math.floor((totalMs % 3600000)/60000);

let dec = totalMs / 3600000;
let q = Math.round(dec*4)/4;

document.getElementById("total").innerText = `${h}h ${m}m`;
document.getElementById("decimal").innerText = dec.toFixed(2)+" Hours";
document.getElementById("quarter").innerText = "Quarter: "+q.toFixed(2);

let s = document.getElementById("status");

if(dec>=14){
s.innerText="🚨 Critical Overtime"; s.style.color="#ef4444";
}else if(dec>=12){
s.innerText="⚠ Heavy Shift"; s.style.color="#fbbf24";
}else{
s.innerText="✅ Normal"; s.style.color="#22c55e";
}

document.getElementById("fill").style.width =
Math.min((dec/16)*100,100)+"%";
}

function render(){
let c=document.getElementById("entries");
c.innerHTML="";

entries.forEach(e=>{

let isLast = entries.length===1;
let is15 = stepMode===15;

c.innerHTML+=`
<div class="card">

<label>Start</label>
<div class="timeRow">
<input type="time"
step="${stepMode*60}"
value="${e.start}"
id="start${e.id}"
oninput="update(${e.id},'start',this.value)">
<button class="clockBtn"
onclick="openPicker(document.getElementById('start${e.id}'))">🕒</button>
</div>

<label>End</label>
<div class="timeRow">
<input type="time"
step="${stepMode*60}"
value="${e.end}"
id="end${e.id}"
oninput="update(${e.id},'end',this.value)">
<button class="clockBtn"
onclick="openPicker(document.getElementById('end${e.id}'))">🕒</button>
</div>

<div class="row">

<button class="secondary"
${!is15?'disabled':''}
onclick="snapEnd(${e.id})">
${is15?'Snap .25':'Exact'}
</button>

<button class="secondary"
onclick="clearEntry(${e.id})">Clear</button>

<button class="danger ${isLast?'disabled':''}"
${isLast?'disabled':''}
onclick="removeEntry(${e.id})">Remove</button>

</div>

</div>
`;
});

save();
calculate();
}

function save(){
localStorage.setItem("runtime", JSON.stringify(entries));
}

function load(){
let d = localStorage.getItem("runtime");
if(d){ entries=JSON.parse(d); }
if(entries.length===0) addEntry();
render();
}

load();
</script>

</body>
</html>
