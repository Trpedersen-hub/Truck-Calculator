<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truck Runtime Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
}

.header {
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 15px;
}

.header h1 {
    margin: 0;
    font-size: 32px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
}

label {
    display: block;
    margin-top: 20px;
    margin-bottom: 8px;
    font-size: 22px;
    font-weight: bold;
}

input {
    width: 100%;
    height: 75px;
    font-size: 28px;
    border: 2px solid #d1d5db;
    border-radius: 12px;
    padding: 10px;
}

.result {
    margin-top: 25px;
    text-align: center;
    background: #ecfdf5;
    border: 2px solid #bbf7d0;
    border-radius: 15px;
    padding: 25px;
}

.result-title {
    font-size: 20px;
    color: #444;
}

.runtime {
    font-size: 54px;
    font-weight: bold;
    color: #15803d;
    margin-top: 10px;
}

.decimal {
    margin-top: 10px;
    font-size: 24px;
    color: #666;
}

.footer {
    text-align: center;
    margin-top: 15px;
    color: #666;
    font-size: 14px;
}

@media (max-width: 600px) {
    .runtime {
        font-size: 48px;
    }

    input {
        height: 70px;
        font-size: 26px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🚛 Truck Runtime</h1>
    </div>

    <div class="card">

        <label>Start Time</label>
        <input type="time" id="startTime">

        <label>End Time</label>
        <input type="time" id="endTime">

        <div class="result">
            <div class="result-title">Total Runtime</div>

            <div class="runtime" id="result">
                0h 0m
            </div>

            <div class="decimal" id="decimal">
                0.00 Hours
            </div>
        </div>

    </div>

    <div class="footer">
        Runtime updates automatically
    </div>

</div>

<script>

document.getElementById("startTime").addEventListener("change", calculateTime);
document.getElementById("endTime").addEventListener("change", calculateTime);

function calculateTime() {

    const start = document.getElementById("startTime").value;
    const end = document.getElementById("endTime").value;

    if (!start || !end) {
        return;
    }

    const startDate = new Date("2024-01-01T" + start);
    const endDate = new Date("2024-01-01T" + end);

    let diff = endDate - startDate;

    if (diff < 0) {
        diff += 24 * 60 * 60 * 1000;
    }

    const hours = Math.floor(diff / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

    const decimalHours = (diff / (1000 * 60 * 60)).toFixed(2);

    document.getElementById("result").innerHTML =
        hours + "h " + minutes + "m";

    document.getElementById("decimal").innerHTML =
        decimalHours + " Hours";
}

</script>

</body>
</html>
