<body>
 
<div class="content">
 
<h1>Work Hours</h1>
 
<div class="card">
<label>Start Time</label>
<input type="time" id="startTime">
</div>
 
<div class="card">
<label>End Time</label>
<input type="time" id="endTime">
</div>
 
<div class="card">
<label>Downtime (minutes)</label>
<input type="number" id="downtime" value="0">
 
<label>Standby (minutes)</label>
<input type="number" id="standby" value="0">
</div>
 
<div class="card">
<div class="result-label">TOTAL TIME</div>
<div class="result" id="total">0h 0m</div>
 
<br>
 
<div class="result-label">BILLABLE TIME</div>
<div class="result" id="billable">0h 0m</div>
</div>
 
</div>
 
<div class="bottom-tabs">
<div class="tab">🌎<br>World Clock</div>
<div class="tab">⏰<br>Alarm</div>
<div class="tab">⏱️<br>Stopwatch</div>
<div class="tab">⏲️<br>Timer</div>
<div class="tab active">🚛<br>Work Hours</div>
</div>
 
</body>
