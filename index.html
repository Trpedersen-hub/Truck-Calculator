<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚛 Truck Runtime Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
background:
linear-gradient(
180deg,
#020617 0%,
#07111f 100%
);
color:white;
padding:15px 15px 100px;
}

.container{
max-width:800px;
margin:auto;
}

h1{
text-align:center;
font-size:34px;
margin-bottom:15px;
color:#4ade80;
}

.mode{
text-align:center;
padding:16px;
border-radius:20px;
cursor:pointer;
font-weight:800;
margin-bottom:15px;

background:rgba(15,23,42,.85);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 10px 30px rgba(0,0,0,.25),
inset 0 1px rgba(255,255,255,.08);
}

.card{
background:rgba(15,23,42,.85);

backdrop-filter:blur(20px);

border-radius:28px;

padding:18px;

margin-bottom:16px;

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 10px 30px rgba(0,0,0,.30),
inset 0 1px rgba(255,255,255,.08);

animation:fadeIn .2s ease;
}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}

}

label{
display:block;
margin-bottom:6px;
margin-top:8px;
opacity:.75;
font-size:13px;
}

.timeDisplay{

width:100%;
height:78px;

border:none;
border-radius:22px;

background:#0f172a;

color:#4ade80;

font-size:30px;
font-weight:800;

cursor:pointer;

margin-bottom:12px;

transition:.2s;

box-shadow:
inset 0 1px rgba(255,255,255,.05),
0 8px 20px rgba(0,0,0,.25);

}

.timeDisplay:active{
transform:scale(.98);
}

.hiddenTime{
position:absolute;
opacity:0;
pointer-events:none;
}

.row{
display:flex;
gap:8px;
margin-top:12px;
}

button{
border:none;
cursor:pointer;
border-radius:14px;
padding:12px;
font-weight:700;
}

.primary{
background:#22c55e;
color:black;
}

.secondary{
background:#1f2937;
color:white;
}

.danger{
background:#ef4444;
color:white;
}

.disabled{
opacity:.35;
cursor:not-allowed;
}

.blockRuntime{
text-align:center;
font-size:24px;
font-weight:800;
color:#4ade80;
margin-top:12px;
}

.result{
padding:28px;
border-radius:30px;

background:
linear-gradient(
135deg,
rgba(34,197,94,.15),
rgba(34,197,94,.03)
);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.08);

text-align:center;
}

.big{
font-size:72px;
font-weight:900;
line-height:1;
color:#4ade80;
}

.small{
margin-top:8px;
opacity:.85;
}

.statusNormal{
color:#4ade80;
}

.statusExtended{
color:#facc15;
}

.statusLong{
color:#ef4444;
}

.bar{
height:12px;
background:#1f2937;
border-radius:999px;
overflow:hidden;
margin-top:15px;
}

.fill{
height:100%;
width:0%;

background:
linear-gradient(
90deg,
#22c55e,
#4ade80,
#86efac
);

transition:.3s;
}

.fab{
position:fixed;

right:20px;
bottom:20px;

width:72px;
height:72px;

border-radius:50%;

font-size:40px;

background:#22c55e;

color:black;

box-shadow:
0 10px 30px rgba(34,197,94,.45);

z-index:1000;
}

@media(max-width:500px){

.big{
font-size:56px;
}

.timeDisplay{
font-size:24px;
}

}

</style>
</head>
<body>

<div class="container">

<h1>🚛 Truck Runtime</h1>

<div id="modeBtn"
class="mode"
onclick="toggleMode()">
15 MIN MODE
</div>

<div id="entries"></div>

<div class="result">

<div id="total" class="big">
0h 0m
</div>

<div id="decimal" class="small">
0.00 Hours
</div>

<div id="quarter" class="small">
Quarter: 0.00
</div>

<div id="status" class="small statusNormal">
Ready
</div>

<div class="bar">
<div id="fill" class="fill"></div>
</div>

</div>

</div>

<button class="fab"
onclick="addEntry()">
+
</button>

<script>

let stepMode = 15;
let entries = [];

function vibrate(){

if(navigator.vibrate){
navigator.vibrate(10);
}

}

function toggleMode(){

vibrate();

stepMode =
stepMode === 15 ? 1 : 15;

document.getElementById("modeBtn").innerText =
stepMode === 15
? "15 MIN MODE"
: "1 MIN MODE";

render();

}

function addEntry(){

vibrate();

let previous =
entries[entries.length - 1];

entries.push({

id: Date.now() + Math.random(),

start: previous?.end || "",

end: ""

});

save();
render();

}

function removeEntry(id){

vibrate();

if(entries.length === 1)
return;

entries =
entries.filter(x => x.id != id);

save();
render();

}

function clearEntry(id){

vibrate();

let e =
entries.find(x => x.id == id);

if(!e) return;

e.start = "";
e.end = "";

save();
render();

}

function update(id,field,value){

let e =
entries.find(x => x.id == id);

if(!e) return;

e[field] = value;

save();
render();

}

function getCurrentTime(){

let now = new Date();

if(stepMode === 15){

let mins =

Math.round(
now.getMinutes()/15
) * 15;

if(mins === 60){

now.setHours(
now.getHours()+1
);

mins = 0;

}

now.setMinutes(
mins,
0,
0
);

}

let h =
String(now.getHours())
.padStart(2,'0');

let m =
String(now.getMinutes())
.padStart(2,'0');

return h + ":" + m;

}

function startNow(id){

vibrate();

let e =
entries.find(x => x.id == id);

e.start =
getCurrentTime();

save();
render();

}

function snapEnd(id){

vibrate();

let e =
entries.find(x => x.id == id);

e.end =
getCurrentTime();

save();
render();

}

function getDuration(start,end){

if(!start || !end)
return 0;

let s =
new Date("2025-01-01T"+start);

let e =
new Date("2025-01-01T"+end);

let diff = e - s;

if(diff < 0)
diff += 86400000;

if(stepMode === 15){

let mins = diff / 60000;

mins =
Math.round(mins/15)*15;

diff =
mins * 60000;

}

return diff;

}

function calculate(){

let totalMs = 0;

entries.forEach(entry => {

totalMs +=
getDuration(
entry.start,
entry.end
);

});

let hours =
Math.floor(totalMs/3600000);

let minutes =
Math.floor(
(totalMs%3600000)/60000
);

let decimal =
totalMs / 3600000;

let quarter =
Math.round(decimal*4)/4;

document.getElementById("total").innerText =
hours + "h " + minutes + "m";

document.getElementById("decimal").innerText =
decimal.toFixed(2) + " Hours";

document.getElementById("quarter").innerText =
"Quarter: " +
quarter.toFixed(2);

document.getElementById("fill").style.width =
Math.min((decimal/16)*100,100)+"%";

const status =
document.getElementById("status");

if(decimal < 8){

status.innerText =
"Normal Shift";

status.className =
"small statusNormal";

}
else if(decimal < 12){

status.innerText =
"Extended Shift";

status.className =
"small statusExtended";

}
else{

status.innerText =
"Long Day";

status.className =
"small statusLong";

}

}

function render(){

const container =
document.getElementById("entries");

container.innerHTML = "";

entries.forEach(entry => {

const runtimeMs =
getDuration(
entry.start,
entry.end
);

const h =
Math.floor(runtimeMs/3600000);

const m =
Math.floor(
(runtimeMs%3600000)/60000
);

const runtime =
runtimeMs
? `${h}h ${m}m`
: "--";

const isLast =
entries.length === 1;

container.innerHTML += `

<div class="card">

<label>Start Time</label>

<button
class="timeDisplay"
onclick="document.getElementById('start-${entry.id}').showPicker()">

${entry.start || "Tap To Select"}

</button>

<input
id="start-${entry.id}"
class="hiddenTime"
type="time"
value="${entry.start}"
step="${stepMode===15?900:60}"
onchange="update('${entry.id}','start',this.value)"
>

<label>End Time</label>

<button
class="timeDisplay"
onclick="document.getElementById('end-${entry.id}').showPicker()">

${entry.end || "Tap To Select"}

</button>

<input
id="end-${entry.id}"
class="hiddenTime"
type="time"
value="${entry.end}"
step="${stepMode===15?900:60}"
onchange="update('${entry.id}','end',this.value)"
>

<div class="blockRuntime">

${runtime}

</div>

<div class="row">

<button
class="primary"
onclick="startNow('${entry.id}')">

Start Now

</button>

<button
class="primary"
onclick="snapEnd('${entry.id}')">

${stepMode===15
? 'End .25'
: 'End Now'}

</button>

</div>

<div class="row">

<button
class="secondary"
onclick="clearEntry('${entry.id}')">

Clear

</button>

<button
class="danger ${isLast?'disabled':''}"
${isLast?'disabled':''}
onclick="removeEntry('${entry.id}')">

Remove

</button>

</div>

</div>

`;

});

calculate();

}

function save(){

localStorage.setItem(
"runtime",
JSON.stringify(entries)
);

}

function load(){

let saved =
localStorage.getItem("runtime");

if(saved){

entries =
JSON.parse(saved);

}

if(entries.length === 0){

entries.push({

id:Date.now(),

start:"",

end:""

});

}

render();

}

load();

</script>

</body>
</html>
