<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truck Runtime Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#020617;color:white;padding:15px;}
.container{max-width:700px;margin:auto;}

h1{text-align:center;color:#4ade80;margin-bottom:10px;}

.card{background:#020617;border:1px solid #1f2937;border-radius:14px;padding:12px;margin-bottom:12px;}

label{font-size:14px;opacity:.7;}

.timeRow{display:flex;gap:8px;align-items:center;}

input{
flex:1;
padding:10px;
border-radius:8px;
border:1px solid #1f2937;
background:#020617;
color:#4ade80;
font-size:18px;
text-align:center;
}

.clockBtn{
width:50px;
background:#1f2937;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
}

.row{display:flex;gap:8px;margin-top:8px;}

button{
flex:1;
padding:10px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.primary{background:#22c55e;color:black;}
.secondary{background:#1f2937;color:white;}
.danger{background:#ef4444;color:white;}
.disabled{opacity:.4;cursor:not-allowed;}

.mode{
text-align:center;padding:8px;margin-bottom:10px;
background:#1f2937;border-radius:10px;cursor:pointer;
}

.result{text-align:center;margin-top:15px;}
.big{font-size:42px;color:#4ade80;}
.small{opacity:.75;}

.bar{height:8px;background:#1f2937;border-radius:10px;overflow:hidden;margin-top:10px;}
.fill{height:100%;background:#22c55e;width:0%;}

/* ✅ WHEEL MODAL */
.modal{
position:fixed;bottom:0;left:0;width:100%;
background:#020617;border-top:2px solid #22c55e;
padding:20px;display:none;
}

.picker{
display:flex;justify-content:center;gap:20px;
}

select{
height:150px;
font-size:20px;
background:#020617;color:white;
border:1px solid #1f2937;
}

.modalBtns{
display:flex;gap:10px;margin-top:15px;
}
</style>
</head>

<body>

<div class="container">
<h1>🚛 Truck Runtime</h1>

<div id="modeBtn" class="mode" onclick="toggleMode()">15 MIN MODE</div>

<div id="entries"></div>

<button class="primary" onclick="addEntry()">+ Add Block</button>

<div class="card result">
<div class="big" id="total">0h 0m</div>
<div class="small" id="decimal">0.00 Hours</div>
<div class="small" id="quarter">Quarter: 0.00</div>
<div class="small" id="status">Ready</div>
<div class="bar"><div id="fill" class="fill"></div></div>
</div>
</div>

<!-- ✅ WHEEL PICKER -->
<div id="pickerModal" class="modal">
<div class="picker">
<select id="hours"></select>
<select id="minutes"></select>
</div>

<div class="modalBtns">
<button class="primary" onclick="applyTime()">✔ Set</button>
<button class="danger" onclick="closePicker()">Cancel</button>
</div>
</div>

<script>
let stepMode = 15;
let entries = [];
let activeField = null;
let activeId = null;

function toggleMode(){
stepMode = stepMode === 15 ? 1 : 15;
document.getElementById("modeBtn").innerText =
stepMode===15 ? "15 MIN MODE" : "1 MIN MODE";
render();
}

function addEntry(){
entries.push({id:Date.now(),start:"",end:""});
render();
}

function removeEntry(id){
if(entries.length===1)return;
entries=entries.filter(e=>e.id!==id);
render();
}

function clearEntry(id){
let e=entries.find(x=>x.id===id);
e.start=""; e.end="";
render();
}

function update(id, field, val){
let e=entries.find(x=>x.id===id);
e[field]=val;
save();calculate();
}

// ✅ OPEN CUSTOM PICKER
function openPicker(id, field){
activeId=id;
activeField=field;

let hSel=document.getElementById("hours");
let mSel=document.getElementById("minutes");

hSel.innerHTML="";
mSel.innerHTML="";

// hours
for(let i=0;i<24;i++){
hSel.innerHTML+=`<option>${String(i).padStart(2,'0')}</option>`;
}

// minutes
if(stepMode===15){
['00','15','30','45'].forEach(m=>{
mSel.innerHTML+=`<option>${m}</option>`;
});
}else{
for(let i=0;i<60;i++){
mSel.innerHTML+=`<option>${String(i).padStart(2,'0')}</option>`;
}
}

document.getElementById("pickerModal").style.display="block";
}

function closePicker(){
document.getElementById("pickerModal").style.display="none";
}

function applyTime(){
let h=document.getElementById("hours").value;
let m=document.getElementById("minutes").value;

let val=h+":"+m;

let e=entries.find(x=>x.id===activeId);
e[activeField]=val;

closePicker();
render();
}

// ✅ SNAP BUTTON
function snapEnd(id){
let now=new Date();

if(stepMode===15){
let mins=Math.round(now.getMinutes()/15)*15;
now.setMinutes(mins);
}

let h=String(now.getHours()).padStart(2,'0');
let m=String(now.getMinutes()).padStart(2,'0');

let e=entries.find(x=>x.id===id);
e.end=h+":"+m;

render();
}

function calculate(){

let totalMs=0;

entries.forEach(e=>{
if(!e.start||!e.end)return;

let s=new Date("2025-01-01T"+e.start);
let ed=new Date("2025-01-01T"+e.end);

let diff=ed-s;
if(diff<0) diff+=86400000;

if(stepMode===15){
let mins=diff/60000;
mins=Math.round(mins/15)*15;
diff=mins*60000;
}

totalMs+=diff;
});

let h=Math.floor(totalMs/3600000);
let m=Math.floor((totalMs%3600000)/60000);

let dec=totalMs/3600000;
let q=Math.round(dec*4)/4;

document.getElementById("total").innerText=`${h}h ${m}m`;
document.getElementById("decimal").innerText=dec.toFixed(2)+" Hours";
document.getElementById("quarter").innerText="Quarter: "+q.toFixed(2);

document.getElementById("fill").style.width=
Math.min((dec/16)*100,100)+"%";
}

function render(){
let c=document.getElementById("entries");
c.innerHTML="";

entries.forEach(e=>{

let isLast=entries.length===1;

c.innerHTML+=`
<div class="card">

<label>Start</label>
<div class="timeRow">
<input value="${e.start}" readonly>
<button class="clockBtn"
onclick="openPicker(${e.id},'start')">🕒</button>
</div>

<label>End</label>
<div class="timeRow">
<input value="${e.end}" readonly>
<button class="clockBtn"
onclick="openPicker(${e.id},'end')">🕒</button>
</div>

<div class="row">
<button class="secondary"
onclick="snapEnd(${e.id})">
${stepMode===15?'Snap .25':'Exact'}
</button>

<button class="secondary"
onclick="clearEntry(${e.id})">Clear</button>

<button class="danger ${isLast?'disabled':''}"
${isLast?'disabled':''}
onclick="removeEntry(${e.id})">Remove</button>
</div>

</div>`;
});

save();
calculate();
}

function save(){
localStorage.setItem("runtime", JSON.stringify(entries));
}

function load(){
let d=localStorage.getItem("runtime");
if(d) entries=JSON.parse(d);
if(entries.length===0) addEntry();
render();
}

load();
</script>

</body>
</html>
