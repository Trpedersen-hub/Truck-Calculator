<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Truck Runtime X Ultra</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}

body{
background:#020617;
color:white;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
}

h1{
text-align:center;
color:#4ade80;
margin-bottom:10px;
}

.card{
background:#020617;
border:1px solid #1f2937;
border-radius:16px;
padding:15px;
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
margin-top:5px;
margin-bottom:10px;
border-radius:10px;
background:#020617;
border:1px solid #1f2937;
color:#4ade80;
font-size:18px;
text-align:center;
}

button{
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.addBtn{background:#22c55e;color:black;width:100%;}
.removeBtn{background:#ef4444;color:white;}

.row{
display:flex;
gap:10px;
}

.runtimeBar{
height:10px;
background:#1f2937;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
background:#22c55e;
}

.result{
text-align:center;
margin-top:15px;
}

.total{
font-size:40px;
color:#4ade80;
}

.small{
opacity:.7;
}

.mode{
text-align:center;
margin-bottom:10px;
cursor:pointer;
padding:8px;
background:#1f2937;
border-radius:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>🚛 Truck Runtime Ultra</h1>

<div class="mode" onclick="toggleMode()" id="modeBtn">
15 MIN MODE
</div>

<div id="entries"></div>

<button class="addBtn" onclick="addEntry()">+ Add Runtime Block</button>

<div class="card result">
<div class="total" id="total">0h 0m</div>

<div class="small" id="decimal">0.00 Hours</div>
<div class="small" id="quarter">Quarter: 0.00</div>

<div id="status" class="small">Ready</div>

<div class="runtimeBar">
<div id="barFill" class="fill" style="width:0%"></div>
</div>

</div>

</div>

<script>
let stepMode = 15; // minutes default
let entries = [];

function toggleMode(){
stepMode = stepMode === 15 ? 1 : 15;
document.getElementById("modeBtn").innerText =
stepMode===15 ? "15 MIN MODE" : "1 MIN MODE";
}

function addEntry(start="", end=""){
let id = Date.now();

entries.push({id,start,end});

render();
}

function removeEntry(id){
entries = entries.filter(e => e.id !== id);
render();
}

function updateValue(id, field, value){
let e = entries.find(x=>x.id===id);
e[field]=value;
save();
calculate();
}

function render(){
let container = document.getElementById("entries");
container.innerHTML="";

entries.forEach(e=>{
container.innerHTML += `
<div class="card">
<label>Start</label>
<input type="time" value="${e.start}" 
oninput="updateValue(${e.id},'start',this.value)">

<label>End</label>
<input type="time" value="${e.end}" 
oninput="updateValue(${e.id},'end',this.value)">

<button class="removeBtn" onclick="removeEntry(${e.id})">
Remove
</button>
</div>
`;
});

save();
calculate();
}

function calculate(){

let totalMinutes = 0;

entries.forEach(e=>{

if(!e.start || !e.end) return;

let s = new Date("2025-01-01T"+e.start);
let ed = new Date("2025-01-01T"+e.end);

let diff = ed - s;
if(diff<0) diff += 86400000;

let mins = diff/60000;

// snap if 15 min mode
if(stepMode === 15){
mins = Math.round(mins/15)*15;
}

totalMinutes += mins;

});

let hrs = Math.floor(totalMinutes/60);
let rem = Math.round(totalMinutes%60);

let decimal = totalMinutes/60;
let quarter = Math.round(decimal*4)/4;

document.getElementById("total").innerText =
`${hrs}h ${rem}m`;

document.getElementById("decimal").innerText =
decimal.toFixed(2) + " Hours";

document.getElementById("quarter").innerText =
"Quarter: " + quarter.toFixed(2);

// overtime tiers
let status = document.getElementById("status");

if(decimal >= 14){
status.innerText="🚨 Critical Overtime";
status.style.color="#ef4444";
}else if(decimal >= 12){
status.innerText="⚠ Heavy Shift";
status.style.color="#fbbf24";
}else{
status.innerText="✅ Normal";
status.style.color="#22c55e";
}

// bar (max 16 hrs scale)
let pct = Math.min((decimal/16)*100,100);
document.getElementById("barFill").style.width = pct+"%";

}

function save(){
localStorage.setItem("runtimeEntries", JSON.stringify(entries));
}

function load(){
let data = localStorage.getItem("runtimeEntries");
if(data){
entries = JSON.parse(data);
}
if(entries.length===0) addEntry();
render();
}

load();
</script>

</body>
</html>
