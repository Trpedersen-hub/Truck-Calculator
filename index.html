<html>

<title>Work Hours Calculator</title>
style.css
</head>
<body>
 
<h1>Work Hours</h1>
 
<label>Start Time</label>
<input type="time" id="startTime">
 
<label>End Time</label>
<input type="time" id="endTime">
 
<label>Downtime (minutes)</label>
<input type="number" id="downtime" value="0">
 
<label>Standby (minutes)</label>
<input type="number" id="standby" value="0">
 
<h2>Total Time: <span id="total">0h 0m</span></h2>
<h2>Billable Time: <span id="billable">0h 0m</span></h2>
