<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Truck Runtime Pro</title>

<link rel="apple-touch-icon" href="truck-icon.png">
.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Truck Runtime">
<meta name="theme-color" content="#0f172a">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(180deg,#0f172a,#1e293b);
min-height:100vh;
padding:15px;
color:white;
}

.container{
max-width:650px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:42px;
margin-bottom:5px;
}

.header p{
color:#94a3b8;
}

.card{
background:#111827;
border-radius:20px;
padding:25px;
box-shadow:0 0 30px rgba(0,0,0,.35);
}

label{
display:block;
font-size:22px;
font-weight:bold;
margin-top:15px;
margin-bottom:10px;
}

input{
width:100%;
height:80px;
font-size:30px;
border:none;
border-radius:15px;
padding:15px;
background:#1f2937;
color:white;
}

.result{
margin-top:25px;
padding:25px;
border-radius:20px;
background:#052e16;
text-align:center;
border:2px solid #22c55e;
}

.result-title{
font-size:20px;
color:#d1fae5;
}

.runtime{
font-size:60px;
font-weight:bold;
margin-top:10px;
color:#4ade80;
}

.decimal{
font-size:28px;
margin-top:10px;
}

.overtime{
margin-top:15px;
font-size:20px;
font-weight:bold;
}

.normal{
color:#22c55e;
}

.warning{
color:#fbbf24;
}

.buttons{
display:flex;
gap:10px;
margin-top:20px;
}

button{
flex:1;
height:65px;
font-size:22px;
font-weight:bold;
border:none;
border-radius:15px;
cursor:pointer;
}

.reset{
background:#dc2626;
color:white;
}

.now{
background:#2563eb;
color:white;
}

.footer{
text-align:center;
margin-top:15px;
color:#94a3b8;
}

@media(max-width:600px){

.header h1{
font-size:34px;
}

.runtime{
font-size:52px;
}

input{
font-size:26px;
height:75px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🚛 Truck Runtime Pro</h1>
<p>Fleet Runtime Calculator</p>
</div>

<div class="card">

<label>Start Time</label>
<input type="time" id="startTime">

<label>End Time</label>
<input type="time" id="endTime">

<div class="buttons">
<button class="now" onclick="setCurrentTime()">Use Current Time</button>
<button class="reset" onclick="resetForm()">Reset</button>
</div>

<div class="result">

<div class="result-title">
TOTAL RUNTIME
</div>

<div class="runtime" id="result">
0h 0m
</div>

<div class="decimal" id="decimal">
0.00 Hours
</div>

<div class="overtime normal" id="overtime">
Ready
</div>

</div>

</div>

<div class="footer">
Saved to Home Screen = behaves like an app
</div>

</div>

<script>

document.getElementById("startTime").addEventListener("change", calculateTime);
document.getElementById("endTime").addEventListener("change", calculateTime);

function calculateTime() {

const start=document.getElementById("startTime").value;
const end=document.getElementById("endTime").value;

if(!start || !end){
return;
}

const startDate=new Date("2025-01-01T"+start);
const endDate=new Date("2025-01-01T"+end);

let diff=endDate-startDate;

if(diff<0){
diff+=24*60*60*1000;
}

const hours=Math.floor(diff/(1000*60*60));

const minutes=Math.floor(
(diff%(1000*60*60))/(1000*60)
);

const decimalHours=(diff/(1000*60*60)).toFixed(2);

document.getElementById("result").innerHTML=
hours+"h "+minutes+"m";

document.getElementById("decimal").innerHTML=
decimalHours+" Hours";

const overtime=document.getElementById("overtime");

if(decimalHours >= 12){
overtime.className="overtime warning";
overtime.innerHTML="⚠ Long Shift";
}
else{
overtime.className="overtime normal";
overtime.innerHTML="✅ Normal Shift";
}

}

function resetForm(){

document.getElementById("startTime").value="";
document.getElementById("endTime").value="";

document.getElementById("result").innerHTML="0h 0m";
document.getElementById("decimal").innerHTML="0.00 Hours";
document.getElementById("overtime").innerHTML="Ready";
}

function setCurrentTime(){

const now=new Date();

const hours=String(now.getHours()).padStart(2,'0');
const mins=String(now.getMinutes()).padStart(2,'0');

document.getElementById("endTime").value=
hours+":"+mins;

calculateTime();

}

</script>

</body>
</html>
