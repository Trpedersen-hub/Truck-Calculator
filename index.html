<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck Runtime Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background-color: #0078d4;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005ea6;
        }

        .result {
            margin-top: 25px;
            text-align: center;
            background: #eaf7ea;
            padding: 20px;
            border-radius: 8px;
        }

        .runtime {
            font-size: 32px;
            font-weight: bold;
            color: green;
        }

        .truck {
            margin-top: 10px;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Truck Runtime Calculator</h1>

    <label>Truck Number</label>
    <input type="text" id="truckNumber" placeholder="Truck 101">

    <label>Start Time</label>
    <input type="time" id="startTime">

    <label>End Time</label>
    <input type="time" id="endTime">

    <button onclick="calculateTime()">
        Calculate Runtime
    </button>

    <div class="result">
        <div class="runtime" id="result">
            0h 0m
        </div>

        <div class="truck" id="truckDisplay">
            Enter truck information above
        </div>
    </div>
</div>

<script>
function calculateTime() {

    const truckNumber = document.getElementById("truckNumber").value;
    const start = document.getElementById("startTime").value;
    const end = document.getElementById("endTime").value;

    if (!start || !end) {
        alert("Please enter both Start Time and End Time.");
        return;
    }

    const startDate = new Date("2000-01-01T" + start);
    const endDate = new Date("2000-01-01T" + end);

    let diff = endDate - startDate;

    if (diff < 0) {
        diff += 24 * 60 * 60 * 1000;
    }

    const hours = Math.floor(diff / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

    document.getElementById("result").innerText =
        hours + "h " + minutes + "m";

    document.getElementById("truckDisplay").innerText =
        truckNumber ? "Truck: " + truckNumber : "";
}
</script>

</body>
</html>
