<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Truck Runtime Pro</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container">

<header>

<h1>🚛 Truck Runtime</h1>

<div id="modeBtn"
class="modeButton"
onclick="toggleMode()">
15 MIN MODE
</div>

</header>

<main>

<div id="entries"></div>

<section class="resultCard">

<div id="total" class="totalDisplay">
0h 0m
</div>

<div id="decimal">
0.00 Hours
</div>

<div id="quarter">
Quarter: 0.00
</div>

<div id="status">
Ready
</div>

<div class="progressBar">

<div id="fill" class="progressFill"></div>

</div>

</section>

</main>

</div>

<button
class="fab"
onclick="addEntry()">
+
</button>

<script src="app.js"></script>

</body>
</html>
